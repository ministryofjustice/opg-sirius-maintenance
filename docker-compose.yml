services:
  maintenance:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/maintenance:latest
    build: .
    ports: ["8888:8080"]
    privileged: false
    user: app
    environment:
      PORT: 8080
      HEALTHCHECK: /health-check


  gosec:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    working_dir: /app
    volumes:
      - .:/app
    command: go tool gosec -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  go-lint:
    image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v1.53.3:/root/.cache
    command: golangci-lint run -v --timeout 5m
